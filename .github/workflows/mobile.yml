name: Mobile

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.js'
      - 'capacitor.config.ts'
      - 'android/**'
      - 'ios/**'
      - 'scripts/sync-app-version.js'
      - '.env.mobile'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android AAB/APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          test "$TAG" = "$PKG" || { echo "Tag v$TAG != package.json $PKG"; exit 1; }
      - run: npm run build:mobile
      - run: node scripts/sync-app-version.js
      - run: npx cap sync android
      - name: Restore release keystore
        if: startsWith(github.ref, 'refs/tags/v') && env.KEYSTORE_BASE64 != ''
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
      - name: Build release (signed)
        if: startsWith(github.ref, 'refs/tags/v') && env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: |
          ./gradlew bundleRelease assembleRelease --no-daemon \
            -PGOLDEN_KEYSTORE_FILE="$RUNNER_TEMP/release.keystore" \
            -PGOLDEN_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD" \
            -PGOLDEN_KEY_ALIAS="$KEY_ALIAS" \
            -PGOLDEN_KEY_PASSWORD="$KEY_PASSWORD"
      - name: Build debug APK (PR or unsigned tag)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') || env.KEYSTORE_BASE64 == '' }}
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-build
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          gh release view "$VERSION" >/dev/null 2>&1 || \
            gh release create "$VERSION" --generate-notes --title "$VERSION"
          AAB=$(ls android/app/build/outputs/bundle/release/*.aab 2>/dev/null | head -n1 || true)
          APK=$(ls android/app/build/outputs/apk/release/*.apk 2>/dev/null | head -n1 || true)
          if [ -n "$AAB" ]; then gh release upload "$VERSION" "$AAB" --clobber; fi
          if [ -n "$APK" ]; then gh release upload "$VERSION" "$APK" --clobber; fi

  ios:
    name: iOS build check
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:mobile
      - run: node scripts/sync-app-version.js
      - run: npx cap sync ios
      - name: Compile iOS app (unsigned)
        working-directory: ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build
      - name: Export signed IPA
        if: ${{ vars.IOS_SIGNING_ENABLED == 'true' }}
        env:
          P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE }}
          IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
        working-directory: ios/App
        run: |
          CERT="$RUNNER_TEMP/cert.p12"
          printf '%s' "$P12_BASE64" | base64 -d > "$CERT"
          printf '%s' "$PROFILE_BASE64" | base64 -d > "$RUNNER_TEMP/app.mobileprovision"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/app.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/"
          security create-keychain -p ci-keychain-password ci.keychain || true
          security default-keychain -s ci.keychain
          security unlock-keychain -p ci-keychain-password ci.keychain
          security import "$CERT" -k ~/Library/Keychains/ci.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci-keychain-password ci.keychain
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>${IOS_TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
            <key>compileBitcode</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -workspace App.xcworkspace -scheme App \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            archive
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          mkdir -p "$GITHUB_WORKSPACE/ios-export"
          cp "$RUNNER_TEMP/export"/*.ipa "$GITHUB_WORKSPACE/ios-export/"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ vars.IOS_SIGNING_ENABLED == 'true' }}
        with:
          name: ios-ipa
          path: ios-export/*.ipa
