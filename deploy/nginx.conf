# Enable after Certbot issues the apex and wildcard certificate.
server {
    listen 80;
    listen [::]:80;
    server_name goldencreations.events *.goldencreations.events;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name goldencreations.events *.goldencreations.events;

    ssl_certificate /etc/letsencrypt/live/goldencreations.events/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/goldencreations.events/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 6m;
    include /etc/nginx/snippets/goldenevents-cloudflare-realip.conf;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Overwrite incoming forwarding headers before the application trusts one proxy.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }
}
