# Install on the host after adding your wildcard certificate and key.
server {
    listen 80;
    server_name goldencreation.events *.goldencreation.events;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name goldencreation.events *.goldencreation.events;

    ssl_certificate /etc/ssl/goldencreation/fullchain.pem;
    ssl_certificate_key /etc/ssl/goldencreation/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 6m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Overwrite incoming forwarding headers before the application trusts one proxy.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }
}
